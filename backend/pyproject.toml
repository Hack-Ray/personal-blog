[project]
name = "personal-blog-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "markdown-it-py>=4.2.0",
    "pillow>=11",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.20",
    "python-ulid>=3.0",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
