name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Check the built site (before the next build overwrites out/)
        run: |
          root=$(mktemp -d)
          ln -s "$PWD/out" "$root/personal-blog"
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$root" > /dev/null 2>&1 &
          trap "kill $!" EXIT
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:8123/personal-blog/ && break
            sleep 1
          done
          sh scripts/verify-site.sh http://127.0.0.1:8123/personal-blog
      - name: Build a site with nothing published yet
        run: npm run build
        env:
          SITE_DATA_DIR: test-fixtures/empty-site-data

  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://blog:blog@127.0.0.1:5432/blog_test
    steps:
      - uses: actions/checkout@v5
      # test_exporter runs the frontend snapshot parser on the exported files.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
