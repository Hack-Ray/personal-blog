name: CI

on:
  # Branches are checked through their pull request; main after each merge.
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    # Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          GISCUS_REPO: example/personal-blog
          GISCUS_REPO_ID: R_test
          GISCUS_CATEGORY_ID: DIC_test
      - name: Check the built site (before the next build overwrites out/)
        run: |
          root=$(mktemp -d)
          ln -s "$PWD/out" "$root/personal-blog"
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$root" > /dev/null 2>&1 &
          trap "kill $!" EXIT
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:8123/personal-blog/ && break
            sleep 1
          done
          sh scripts/verify-site.sh http://127.0.0.1:8123/personal-blog
      - name: Check links in the built site
        run: node scripts/check-links.ts
      # The browser download is cached; the system packages it needs are not.
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser tests
        run: npx playwright test
      - name: Build a site with nothing published yet
        run: npm run build
        env:
          SITE_DATA_DIR: test-fixtures/empty-site-data
      - name: Without profile.json the site keeps the default title
        run: |
          grep -q 'class="site-title" href="/personal-blog/">Personal Blog</a>' out/index.html
          grep -q '<title>Personal Blog</title>' out/index.html
          grep -q '<title>Personal Blog</title>' out/feed.xml

  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://blog:blog@127.0.0.1:5432/blog_test
    steps:
      - uses: actions/checkout@v5
      # test_exporter runs the frontend snapshot parser on the exported files.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest
