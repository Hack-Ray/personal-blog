name: Deploy site
# The CMS finds the run for a release by this title (backend/blog/release.py).
run-name: Deploy content ${{ inputs.content_sha || 'HEAD' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_sha:
        description: Commit of the content repo to build (defaults to its HEAD)
        required: false
      content_branch:
        description: Content branch used for the latest-content guard
        required: false

permissions:
  contents: read

# Per-site settings are repository variables (Settings → Secrets and variables →
# Actions → Variables), so a fork changes no code. See docs/fork-and-deploy.md.
env:
  # Defaults to <this repo>-content, e.g. you/personal-blog-content.
  CONTENT_REPO: ${{ vars.CONTENT_REPO || format('{0}-content', github.repository) }}
  CONTENT_BRANCH: ${{ inputs.content_branch || vars.CONTENT_BRANCH }}

jobs:
  # A content release (workflow_dispatch from the CMS) changes no code, and the
  # push that put this code on main already ran ci; the build job still checks
  # the content. This is the only place pushes to main run ci.
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  # A push that changes nothing the site is built from (docs, backend, cms)
  # runs ci only. A content release always builds.
  site-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Without the previous main commit (first push, force push) there is
          # nothing to compare, so build.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(frontend/|\.nvmrc$|\.github/workflows/deploy\.yml$)'; then changed=true; else changed=false; fi
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Runs alongside ci rather than after it; deploy waits for both. ci already
  # runs the unit tests and typecheck, so this job only builds.
  build:
    needs: site-changes
    # Builds unless site-changes found no change, so a failed check still builds.
    if: ${{ !cancelled() && needs.site-changes.outputs.changed != 'false' }}
    # The image ci.yml builds and tests the site on; sharp is a native dependency.
    runs-on: ubuntu-24.04
    # One build and one deploy at a time; a newer queued job replaces an older
    # queued one and a running job finishes (Baseline 9.2). Set per job, not
    # per run, so a run that skips them never cancels a queued release.
    concurrency:
      group: pages-build
      cancel-in-progress: false
    # configure-pages reads the site's URL.
    permissions:
      contents: read
      pages: read
    outputs:
      content_sha: ${{ steps.content.outputs.sha }}
      build_id: ${{ steps.build-id.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - id: content-repo
        name: Validate content repository
        env:
          REPO: ${{ env.CONTENT_REPO }}
        run: |
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          if [ -n "$CONTENT_BRANCH" ]; then git check-ref-format "refs/heads/$CONTENT_BRANCH"; fi
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
      - id: content-token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CONTENT_REPO }}
          ref: ${{ inputs.content_sha || env.CONTENT_BRANCH }}
          token: ${{ steps.content-token.outputs.token || secrets.CONTENT_REPO_TOKEN }}
          path: site-data

      - id: content
        run: echo "sha=$(git -C site-data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The Pages URL, custom domain included, sets the site's origin and basePath.
      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # Building also validates the snapshot: a missing article file, a version
      # mismatch or a missing image fails here and nothing is deployed.
      - run: npm run build
        working-directory: frontend
        env:
          SITE_DATA_DIR: ${{ github.workspace }}/site-data
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GISCUS_REPO: ${{ vars.GISCUS_REPO || github.repository }}
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY || 'Announcements' }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          LEGACY_SITE_URLS: ${{ vars.LEGACY_SITE_URLS }}
          PINNED_GITHUB_USER: ${{ vars.PINNED_GITHUB_USER }}
          GITHUB_TOKEN: ${{ github.token }}

      # Every page of this build carries the id, so the deploy job can tell it is live.
      - id: build-id
        run: echo "id=$(cat frontend/.next/BUILD_ID)" >> "$GITHUB_OUTPUT"

      # A link in an article to a page or image the build does not have fails
      # here, like a missing image does above.
      - run: node scripts/check-links.ts
        working-directory: frontend
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    needs: [ci, build]
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    # Only this job publishes, so only it may write to Pages.
    permissions:
      pages: write
      id-token: write
    # A skipped ci would otherwise skip deploy too.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: content-repo
        name: Validate content repository
        env:
          REPO: ${{ env.CONTENT_REPO }}
        run: |
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          if [ -n "$CONTENT_BRANCH" ]; then git check-ref-format "refs/heads/$CONTENT_BRANCH"; fi
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
      - id: content-token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.content-repo.outputs.owner }}
          repositories: ${{ steps.content-repo.outputs.name }}
          permission-contents: read
      - id: latest
        env:
          TOKEN: ${{ steps.content-token.outputs.token || secrets.CONTENT_REPO_TOKEN }}
          BUILT: ${{ needs.build.outputs.content_sha }}
        # A failed lookup must fail the run: an empty HEAD would read as newer
        # content and skip the deploy, and the CMS would record the release as
        # superseded.
        run: |
          set -o pipefail
          ref=HEAD
          if [ -n "$CONTENT_BRANCH" ]; then ref="refs/heads/$CONTENT_BRANCH"; fi
          head=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${CONTENT_REPO}.git" "$ref" | cut -f1)
          [ -n "$head" ] || { echo "::error::Could not read the content repository HEAD."; exit 1; }
          if [ "$head" = "$BUILT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: built content $BUILT, but content HEAD is now $head."
          fi

      - id: deployment
        name: Deploy to GitHub Pages
        if: steps.latest.outputs.current == 'true'
        uses: actions/deploy-pages@v5

      # Pages accepting the artifact does not prove visitors get it. A broken
      # domain, certificate or CDN setting fails the run here, so GitHub sends
      # the usual failure email. The query string bypasses cached copies.
      - name: Check the live site
        if: steps.deployment.outcome == 'success'
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          for attempt in $(seq 60); do
            if curl -fsSL --max-time 20 "${URL%/}/?deploy=${GITHUB_RUN_ID}-${attempt}" | grep -qF "$BUILD_ID"; then
              echo "The live site serves build $BUILD_ID."
              exit 0
            fi
            sleep 10
          done
          echo "::error::${URL} did not serve build $BUILD_ID within 10 minutes."
          exit 1
