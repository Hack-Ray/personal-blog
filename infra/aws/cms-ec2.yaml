AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One EC2 host for the blog CMS, reached through Cloudflare Tunnel and deployed
  by GitHub Actions over SSM Run Command. No inbound ports. See docs/cloud-ec2.md.

Parameters:
  GitHubRepository:
    Type: String
    Description: >-
      The code repository that may deploy, as the OIDC subject names it: owner/repo with the same case
      as on GitHub, or owner@<id>/repo@<id> when the repo uses immutable subject claims.
    AllowedPattern: ^[A-Za-z0-9_.-]+(@[0-9]+)?/[A-Za-z0-9_.-]+(@[0-9]+)?$
  GitHubEnvironment:
    Type: String
    Default: cms-production
    AllowedPattern: ^[A-Za-z0-9_.-]+$
  CreateGitHubOidcProvider:
    Type: String
    Description: false when this account already has the token.actions.githubusercontent.com provider.
    AllowedValues: ["true", "false"]
    Default: "true"
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A public subnet (route to an internet gateway). The host gets a public IP for outbound traffic only.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3a.small, t3a.medium]
  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 10
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      An Amazon Linux 2023 x86-64 AMI ID, fixed so that stack updates never replace the host. Look it up with
      aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64.
  ParameterPath:
    Type: String
    Description: SSM path holding the CMS environment, one parameter per variable.
    Default: /blog/cms
    AllowedPattern: ^(/[A-Za-z0-9_.-]+)+$
  TunnelTokenParameter:
    Type: String
    Default: /blog/cloudflared-token
    AllowedPattern: ^(/[A-Za-z0-9_.-]+)+$
  BackupRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Blog CMS host, outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Updates, image pulls, SSM, S3 and Cloudflare Tunnel

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-backups
            Status: Enabled
            ExpirationInDays: !Ref BackupRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref BackupRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: remove-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub ${BackupBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: blog-cms-host
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # SecureStrings use the aws/ssm key, which needs no kms:Decrypt grant.
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPath}
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TunnelTokenParameter}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPath}-github-app-pem
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPath}-gsc-credentials
              # aws s3 sync lists the prefix to skip files already uploaded.
              # There is no read or delete; versioning keeps overwritten backups.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: ["cms/*"]
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${BackupBucket.Arn}/cms/*
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              # The CMS's infrastructure page. GetMetricStatistics has no
              # resource-level permissions and is in the CloudWatch free tier.
              - Effect: Allow
                Action: cloudwatch:GetMetricStatistics
                Resource: "*"

  HostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]

  Host:
    Type: AWS::EC2::Instance
    # A replacement (a new ImageId) keeps the old host and its local database
    # instead of terminating it. Deleting the stack still deletes it,
    # because a retained host would keep the security group from being deleted.
    UpdateReplacePolicy: Retain
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3011]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostInstanceProfile
      # A hop limit of 1 keeps bridge-network containers (Postgres) away from
      # the instance credentials. The CMS uses the host network and still has them.
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref HostSecurityGroup]
          AssociatePublicIpAddress: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-cms

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: blog-cms-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              # GetCommandInvocation has no resource-level permissions.
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

Outputs:
  InstanceId:
    Value: !Ref Host
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  BackupBucket:
    Value: !Ref BackupBucket
  BackupTarget:
    Description: The --s3 value for cloud-host-setup.sh
    Value: !Sub s3://${BackupBucket}/cms/
  LogGroup:
    Value: !Ref LogGroup
  Region:
    Value: !Ref AWS::Region
